# main'e her push'ta (yönetim panelinden kaydetme dahil):
#  1) Hostinger için gerçek alan adlı derleme → `yayin` dalına (panel buradan çekip siteyi günceller)
#  2) GitHub Pages önizlemesi → https://mehmetcivici.github.io/la-turca-trade-web/ (arama motorlarına kapalı)
name: Derle ve yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: yayin
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Hostinger derlemesi
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-prod

      - name: yayin dalına gönder
        run: |
          cp cpanel/.htaccess .next-prod/.htaccess
          rm -rf .next-prod/cache .next-prod/types
          cd .next-prod
          git init -q -b yayin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Yayın ${GITHUB_SHA::7}: ${{ github.event.head_commit.message && 'main' || 'elle' }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" yayin

      - name: Önizleme derlemesi (GitHub Pages)
        run: npm run build
        env:
          PAGES_BASE_PATH: /la-turca-trade-web
          PREVIEW: "1"

      - name: Önizlemeden sunucu dosyalarını çıkar
        run: rm -rf out/yonetim out/contact.php

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
