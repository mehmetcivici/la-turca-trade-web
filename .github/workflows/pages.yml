# main'e her push'ta (yönetim panelinden kaydetme dahil):
#  1) Hostinger için gerçek alan adlı derleme → `yayin` dalına (panel buradan çekip siteyi günceller)
#  2) GitHub Pages önizlemesi → https://mehmetcivici.github.io/la-turca-trade-web/ (arama motorlarına kapalı)
name: Derle ve yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: yayin
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      yayin: ${{ steps.yayin.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap lastmod = sayfanın gerçek son değişikliği (git geçmişi)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Hostinger derlemesi
        run: |
          # Statik dosyalar (JS/CSS/font) ve görseller GitHub Pages'ten sunulur; Hostinger yalnızca HTML verir.
          export ASSET_PREFIX="${PAGES_URL}/_prod"
          export ASSET_CDN="${PAGES_URL}"
          npm run build
        env:
          NEXT_DIST_DIR: .next-prod
          PAGES_URL: https://mehmetcivici.github.io/la-turca-trade-web

      - name: yayin dalına gönder (geçmiş korunur)
        id: yayin
        env:
          MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp cpanel/.htaccess .next-prod/.htaccess
          rm -rf .next-prod/cache .next-prod/types
          TITLE=$(printf '%s' "${MSG:-Elle başlatılan derleme}" | head -n 1 | cut -c1-120)
          # Sunucunun doğrulayacağı sürüm bilgisi
          jq -n --arg sha "$GITHUB_SHA" --arg msg "$TITLE" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run "$GITHUB_RUN_ID" \
            '{kanal:"yayin", kaynak:$sha, kisa:($sha[0:7]), mesaj:$msg, tarih:$date, run:$run}' > .next-prod/surum.json
          cd .next-prod
          git init -q -b yayin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          # Önceki yayın sürümünün üstüne ekle (sürüm geçmişi = geri dönüş imkânı)
          if git fetch -q --depth=1 origin yayin 2>/dev/null; then git reset -q --soft FETCH_HEAD; fi
          git add -A
          git commit -q -m "Sürüm ${GITHUB_SHA::7}: ${TITLE}" || { echo "Değişiklik yok"; echo "sha=$(git rev-parse HEAD 2>/dev/null)" >> "$GITHUB_OUTPUT"; exit 0; }
          git push -q origin yayin
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Önizleme derlemesi (GitHub Pages)
        run: npm run build
        env:
          PAGES_BASE_PATH: /la-turca-trade-web
          PREVIEW: "1"

      - name: Önizlemeden sunucu dosyalarını çıkar, Hostinger derlemesinin statik dosyalarını ekle
        run: |
          rm -rf out/yonetim out/contact.php
          mkdir -p out/_prod
          cp -R .next-prod/_next out/_prod/_next

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Pages yayını bitti → yeni HTML'in istediği dosyalar hazır; sunucu şimdi yeni sürümü çeksin
      - name: Sunucuya haber ver (yeni sürümü hemen çeksin)
        if: needs.build.outputs.yayin != ''
        continue-on-error: true
        env:
          SITE: ${{ vars.SITE_URL || 'https://laturcatrade.com' }}
        run: |
          curl -fsS -m 300 -A "LaTurcaTrade-Actions" "${SITE}/yonetim/otomatik.php?v=${{ needs.build.outputs.yayin }}" \
            || echo "::notice::Sunucu yanıt vermedi (site henüz yayında değilse normaldir). Panel veya zamanlanmış görev sürümü çekecek."

